[package]
name = "immuknow"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Create and review personalized immunization notices"
license = "MIT"
repository = "https://github.com/WDGPH/ImmuKnow"

[dependencies]
include_dir = "0.7"
encoding_rs = "0.8"
unicode-normalization = "0.1"
comemo = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["scan-fonts", "datetime", "emit-diagnostics", "embedded-fonts"] }
codespan-reporting = "0.13"
anyhow = "1"
csv = "1.4"
serde-saphyr = "=2.1.0"
sha2 = "0.11"
jsonschema = { version = "=0.60.2", default-features = false }
# PDF stages already use Core workers; avoid nested Rayon parsing.
lopdf = { version = "=0.47.0", default-features = false, features = ["chrono-clock"] }
rand = "0.9"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
quircs = "=0.10.3"

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
debug = 0
strip = true
