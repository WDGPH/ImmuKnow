site_name: ImmuKnow
site_url: https://docs.phiz.ca/immuknow/latest/
repo_url: https://github.com/WDGPH/ImmuKnow
repo_name: WDGPH/ImmuKnow
docs_dir: docs
site_dir: site
copyright: "&copy; 2026 Wellington-Dufferin-Guelph Public Health"

# The external documentation hub supplies the publishing environment.
theme:
  name: material
markdown_extensions:
  - attr_list
  - admonition
  - tables
  - fenced_code
  - pymdownx.snippets
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Home: index.md
  - User Guide:
      - Getting Started: user_guide/getting_started.md
      - Configuration: user_guide/configuration.md
      - ImmuKnow Studio: user_guide/studio.md
      - PHU Templates: user_guide/phu_templates.md
      - CSV Input Fields: user_guide/input_schema.md
      - PDF Review: user_guide/pdf_validation.md
  - Reference:
      - Architecture: reference/architecture.md
      - Command and Facts Reference: reference/api.md
  - Developer Guide:
      - Contributing: developer_guide/contributing.md
      - Testing: developer_guide/testing.md
      - Documentation: developer_guide/documentation.md
