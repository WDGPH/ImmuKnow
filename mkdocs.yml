site_name: ImmuKnow
site_url: https://docs.phiz.ca/immuknow/latest/
repo_url: https://github.com/WDGPH/ImmuKnow
repo_name: WDGPH/ImmuKnow
docs_dir: docs
site_dir: site
copyright: "&copy; 2026 Wellington-Dufferin-Guelph Public Health"

# The external documentation hub supplies the publishing environment.
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - attr_list
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Home: index.md
  - Projects and Contracts: ecosystem.md
  - User Guide:
      - Getting Started: user_guide/getting_started.md
      - Configuration: user_guide/configuration.md
      - ImmuKnow Studio: user_guide/studio.md
      - CSV Input Fields: user_guide/input_schema.md
      - PDF Review: user_guide/pdf_validation.md
      - Performance: user_guide/performance.md
  - Developers and Template Authors:
      - Writing Templates: developer_guide/templates.md
      - Command Reference: developer_guide/cli.md
      - Architecture: developer_guide/architecture.md
      - QR Codes: developer_guide/qr.md
      - Contributing: developer_guide/contributing.md
      - Testing: developer_guide/testing.md
      - Documentation: developer_guide/documentation.md
