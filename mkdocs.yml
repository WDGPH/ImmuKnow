site_name: ImmuKnow
site_url: https://WDGPH.github.io/ImmuKnow/
repo_url: https://github.com/WDGPH/ImmuKnow
repo_name: WDGPH/ImmuKnow
docs_dir: docs
site_dir: site
copyright: "&copy; 2026 Wellington-Dufferin-Guelph Public Health"

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/wdgph-logo.png
  logo_footer: assets/wdgph-logo.png
  favicon: assets/wdgph-logo.png
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: wdgph
      accent: wdgph
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: wdgph
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WDGPH/ImmuKnow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user_guide/getting_started.md
    - Configuration Reference: user_guide/configuration.md
    - PHU Templates: user_guide/phu_templates.md
    - Template playground: user_guide/playground.md
    - Input Schema: user_guide/input_schema.md
    - PDF Validation: user_guide/pdf_validation.md
    - Email Package:
      - Overview: user_guide/email_package/index.md
      - Template Overview: user_guide/email_package/template_overview.md
      - PHU Checklist: user_guide/email_package/phu_checklist.md
      - Email Template Text: user_guide/email_package/email_template_text.md
  - Reference:
    - Architecture: reference/architecture.md
    - API Reference: reference/api.md
  - Developer Guide:
    - Contributing: developer_guide/contributing.md
    - Testing Standards: developer_guide/testing.md
    - Documentation Standards: developer_guide/documentation.md
    - Code Analysis: developer_guide/code_analysis.md
