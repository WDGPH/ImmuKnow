name: Run Pytest
'on':
  push:
    branches:
      - '*'
    paths:
      - 'immuknow/**'
      - 'tests/**'
      - 'scripts/build-native.py'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'immuknow/**'
      - 'tests/**'
      - 'scripts/build-native.py'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test.yml'
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Install system fonts for notice tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-freefont-ttf
      - name: Read the native compiler pin
        id: native
        run: |
          echo "version=$(python scripts/build-native.py --print-typst-version)" >> "$GITHUB_OUTPUT"
      - name: Download and install Typst CLI locally
        run: |
          mkdir -p $HOME/.local/bin
          curl -fL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v${{ steps.native.outputs.version }}/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp/ --strip-components=1
          chmod +x /tmp/typst
          mv /tmp/typst $HOME/.local/bin/typst
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/typst" --version

      - name: Check Python types and formatting
        run: |
          uv run --locked ty check
          uv run --locked ruff check --no-fix .
          uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked pytest --cov --cov-branch --cov-report=xml

      - name: Verify source files were not changed
        run: test -z "$(git status --porcelain)"

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
