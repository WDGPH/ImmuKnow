name: Run Pytest
'on':
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      typst_ver: 0.15.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --group dev
      - name: Download and install Typst CLI locally
        run: |
          mkdir -p $HOME/.local/bin
          curl -fL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v${{ env.typst_ver }}/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp/ --strip-components=1
          chmod +x /tmp/typst
          mv /tmp/typst $HOME/.local/bin/typst
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          typst --version

      - name: Install notice fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-freefont-ttf

      - name: Run tests
        run: uv run pytest --cov --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
