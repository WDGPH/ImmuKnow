name: Run Pytest
'on':
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      typst_ver: 0.15.1
      TYPST_FONT_PATHS: /usr/share/fonts/truetype/freefont
      TYPST_IGNORE_SYSTEM_FONTS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --group dev
      - name: Download and install Typst CLI locally
        run: |
          mkdir -p $HOME/.local/bin
          curl -fL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v${{ env.typst_ver }}/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp/ --strip-components=1
          chmod +x /tmp/typst
          mv /tmp/typst $HOME/.local/bin/typst
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          typst --version

      - name: Install pinned notice fonts
        # Font metrics are part of the notice layout, including the PDF fixtures.
        run: |
          curl -fL --retry 3 \
            https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-freefont/fonts-freefont-ttf_20120503-10build1_all.deb \
            -o "$RUNNER_TEMP/notice-fonts.deb"
          echo "d1424c9d47b2a6bd0d5149ca66f2bab9b4365237bfbb6063659d961bab2f8ccb  $RUNNER_TEMP/notice-fonts.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/notice-fonts.deb" "$RUNNER_TEMP/notice-fonts"
          sudo install -d /usr/share/fonts/truetype/freefont
          sudo install -m 644 "$RUNNER_TEMP/notice-fonts/usr/share/fonts/truetype/freefont/"*.ttf /usr/share/fonts/truetype/freefont/

      - name: Verify synthetic playground fixtures
        run: uv run python -m playground.scripts.examples --check

      - name: Run tests
        run: uv run pytest --cov --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
