name: Test Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      TYPST_FONT_PATHS: /usr/share/fonts/truetype/freefont
      TYPST_IGNORE_SYSTEM_FONTS: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned notice fonts
        run: |
          curl -fL --retry 3 https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-freefont/fonts-freefont-ttf_20120503-10build1_all.deb -o "$RUNNER_TEMP/notice-fonts.deb"
          echo "d1424c9d47b2a6bd0d5149ca66f2bab9b4365237bfbb6063659d961bab2f8ccb  $RUNNER_TEMP/notice-fonts.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/notice-fonts.deb" "$RUNNER_TEMP/notice-fonts"
          sudo install -d /usr/share/fonts/truetype/freefont
          sudo install -m 644 "$RUNNER_TEMP/notice-fonts/usr/share/fonts/truetype/freefont/"*.ttf /usr/share/fonts/truetype/freefont/
      - run: cargo fmt --all --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Build and inspect release archive
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/immuknow-linux-x86_64.tar.gz" \
            -C target/release immuknow -C "$GITHUB_WORKSPACE" LICENSE
          tar -tzf "$RUNNER_TEMP"/dist/*.tar.gz
      - name: Upload native release archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: immuknow-linux-x86_64
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
