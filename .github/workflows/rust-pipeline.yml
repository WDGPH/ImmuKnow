name: Check Rust pipeline

'on':
  push:
    branches: [main]
    paths:
      - 'experiments/rust-pipeline/**'
      - 'immuknow/schemas/**'
      - 'immuknow/typst/**'
      - 'tests/fixtures/render-contract.json'
      - '.github/workflows/rust-pipeline.yml'
  pull_request:
    paths:
      - 'experiments/rust-pipeline/**'
      - 'immuknow/schemas/**'
      - 'immuknow/typst/**'
      - 'tests/fixtures/render-contract.json'
      - '.github/workflows/rust-pipeline.yml'

permissions:
  contents: read

concurrency:
  group: rust-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Build and test Rust pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiments/rust-pipeline
    env:
      # Bound compiler memory; leave application/library runtime threads alone.
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            experiments/rust-pipeline/target
          key: rust-pipeline-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/rust-pipeline/Cargo.lock', 'experiments/rust-pipeline/rust-toolchain.toml') }}
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Build the pipeline
        run: cargo build --release --locked
      - name: Test shared contracts, PDF handling and worker failures
        run: cargo test --release --locked
      - name: Check the executable entry point
        run: target/release/immuknow-rust-pipeline --help
      - name: Verify source files were not changed
        working-directory: .
        run: test -z "$(git status --porcelain)"
