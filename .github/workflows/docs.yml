name: docs
on:
  push:
    branches: [main, studio-core]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install documentation dependencies
        run: uv sync --locked --no-default-groups --group docs
      - name: Build Core documentation
        run: |
          uv run --locked --no-default-groups --group docs python docs/generate_schema_docs.py
          uv run --locked --no-default-groups --group docs mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - run: touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
