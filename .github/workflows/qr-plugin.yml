name: Check QR plugin
'on':
  push:
    paths: ['plugins/qr/**', 'immuknow/typst/vendor/qr/**', '.github/workflows/qr-plugin.yml']
  pull_request:
    paths: ['plugins/qr/**', 'immuknow/typst/vendor/qr/**', '.github/workflows/qr-plugin.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,rust-src --target wasm32-unknown-unknown
      - name: Check Rust formatting
        run: cargo +1.92.0 fmt --manifest-path plugins/qr/Cargo.toml --check
      - name: Rebuild and compare the shipped artifact
        run: python plugins/qr/build.py --check
