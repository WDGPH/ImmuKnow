[package]
name = "immuknow-pdf-backend-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "immuknow-pdf-backend-probe"
path = "src/main.rs"
# Shared PDF/queue unit tests run in the parent crate; this tool has CLI checks.
test = false

[dependencies]
pdf_oxide = { version = "=0.3.78", default-features = false }
lopdf = "=0.47.0"
rand = "0.9"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
debug = 0
strip = true
