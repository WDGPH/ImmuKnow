[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["immuknow"]

[tool.setuptools.package-data]
immuknow = [
    "build.json",
    "schemas/*.json",
    "config/*.json",
    "config/*.yaml",
    "templates/*.typ",
    "templates/assets/*",
    "templates/translations/*.json",
    "templates/lib/immuknow/*",
    "templates/lib/immuknow/src/*.typ",
    "templates/lib/immuknow/locales/*.json",
    "templates/lib/immuknow/vendor/codetastic/*",
    "review_templates/*.typ",
]

[project]
name = "ImmuKnow"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.20.3",
    "pandas",
    "PyYAML",
    "pypdf[crypto]",
    "frictionless",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "setuptools==84.0.0",
    "wheel==0.48.0",
    "ruff==0.13.0",
    "pillow>=12.3.0",
    "pymupdf==1.28.2",
    "zxing-cpp==3.1.1",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ty>=0.0.78",
    "git-changelog>=2.9.7",
    "pypandoc>=1.15",
    "pytest-xdist>=3.8.0",
]
docs = [
    "jinja2>=3.1.6",
    "pygments>=2.21.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=11.0.2",
]

[project.scripts]
immuknow = "immuknow.orchestrator:main"
immuknow-rebundle = "immuknow.rebundle:main"

[tool.coverage.run]
source = ["immuknow"]
omit = ["*/__pycache__/*", "*/site-packages/*"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "= time\\.time\\(\\)",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
