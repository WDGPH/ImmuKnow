[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["immuknow"]

[tool.setuptools.package-data]
immuknow = ["templates/*.typ", "templates/assets/*", "config/*.json", "config/*.yaml", "config/translations/*.json"]

[project]
name = "ImmuKnow"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "PyYAML",
    "openpyxl",
    "pypdf",
    "qrcode>=7.4.2",
    "pillow>=12.3.0",
    "frictionless[excel,csv]"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ty>=0.0.74",
]
docs = [
    "jinja2>=3.1.6",
    "pygments>=2.21.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=11.0.2",
]

[project.scripts]
viper = "immuknow.orchestrator:main"

[tool.coverage.run]
source = ["immuknow"]
omit = ["*/__pycache__/*", "*/site-packages/*"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "= time\\.time\\(\\)",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
