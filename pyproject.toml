[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "templates"]

[project]
name = "ImmuKnow"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "PyYAML",
    "openpyxl",
    "pypdf",
    "qrcode>=7.4.2",
    "pillow>=12.3.0",
    "babel>=2.17.0",
    "rapidfuzz"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ty>=0.0.69",
    "git-changelog>=2.9.6",
    "pypandoc>=1.15",
]
docs = [
    "jinja2>=3.1.6",
    "pygments>=2.20.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=10.21.2",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=1.10.0",
]

[project.scripts]
viper = "pipeline.orchestrator:main"

[tool.coverage.run]
source = ["pipeline"]
omit = ["*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "= time\\.time\\(\\)",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
