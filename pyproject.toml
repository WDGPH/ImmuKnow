[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["immuknow"]

[tool.setuptools.package-data]
immuknow = [
    "build.json",
    "schemas/*.json",
    "config/*.json",
    "config/*.yaml",
    "typst/*",
    "typst/src/*.typ",
    "typst/locales/*.json",
    "typst/vendor/codetastic/*",
]

[project]
name = "ImmuKnow"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "filelock>=4.2.1",
    "pandas",
    "PyYAML",
    "pypdf[crypto]>=6.21.2",
    "frictionless",
    "jsonschema>=4.26.0",
    "pikepdf>=10.17.0",
]

[dependency-groups]
dev = [
    "setuptools==84.2.1",
    "wheel==0.48.0",
    "ruff==0.17.2",
    "pymupdf==1.28.2",
    "zxing-cpp==3.1.1",
    "pytest",
    "pytest-cov",
    "prek",
    "ty>=0.0.91",
    "pytest-xdist>=3.8.0",
]
docs = [
    "jinja2>=3.1.6",
    "pygments>=2.21.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.8.0",
    "pymdown-extensions>=12.3",
]

[project.scripts]
immuknow = "immuknow.orchestrator:main"
immuknow-rebundle = "immuknow.rebundle:main"

[tool.ruff.lint]
# Keep the existing lint policy independent of Ruff's changing defaults.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["immuknow"]
omit = ["*/__pycache__/*", "*/site-packages/*"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "= time\\.time\\(\\)",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
